<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="K2note GG 手牌分析工具：支持免登录本地复盘，也可在明确确认后保存到个人云端牌谱库。" />
    <title>K2note | KishPoker</title>
    <style>.wuxing-site-link{display:none}.site--home .top-nav-actions>.wuxing-site-link{color:#dbcda9;white-space:nowrap;border:1px solid #ffffff45;border-radius:999px;flex:none;align-items:center;min-height:32px;padding:5px 10px;font:600 12px/1.3 system-ui,sans-serif;text-decoration:none;display:inline-flex}.site--home .top-nav-actions>.wuxing-site-link:hover,.site--home .top-nav-actions>.wuxing-site-link:focus-visible{outline-offset:2px;background:#20443b;outline:2px solid #f6e1b9}</style>
    <script type="module" crossorigin src="/assets/index-DTbYLffu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CelOEr2_.css">
  </head>
  <body>
    <div id="root"></div>
    <a class="wuxing-site-link" href="/wuxing.html" aria-label="下载今日五行桌面插件">今日五行 · 下载</a>
    <script src="/runtime-config.js"></script>
    <script>
      (() => {
        const root = document.getElementById('root');
        const link = document.querySelector('.wuxing-site-link');
        const placeLink = () => {
          const actions = root.querySelector('.site--home .top-nav-actions');
          if (actions && link.parentElement !== actions) actions.prepend(link);
          else if (!actions && link.parentElement !== document.body) document.body.append(link);
        };
        new MutationObserver(placeLink).observe(root, { childList: true, subtree: true });
        placeLink();
      })();
    </script>
  </body>
</html>
